[package]
name = "wallcove-engine"
version.workspace = true
edition.workspace = true
description = "Cross-platform wallpaper playback engine for Wallcove"

[dependencies]
wallcove-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
wallpaper = "3.2.0"
enquote = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
glow = "0.17.0"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
gstreamer-gl = "0.24"
gstreamer-gl-egl = "0.24"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols-wlr = { version = "0.2", features = ["client"] }
glutin = "0.32.3"
raw-window-handle = "0.6.2"

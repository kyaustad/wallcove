[workspace]
resolver = "2"
members = [
    "crates/wallcove-core",
    "crates/wallcove-client",
    "crates/wallcovedaemon",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kyle Austad <kyleaustad@gmail.com>"]
description = "An open-source, cross-platform engine for creating and sharing wallpapers."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wallcove-core = { path = "crates/wallcove-core" }
wallcove-client = { path = "crates/wallcove-client" }